name: paboki_pocket
description: Educational Pocket Option overlay assistant by Paboki. Analysis only, no auto-trade.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.5
  flutter_tts: ^4.2.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  paboki_capture:
    path: packages/paboki_capture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/paboki_logo.jpg
    - assets/sounds/beep.wav
